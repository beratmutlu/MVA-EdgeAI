<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML Classification Summary</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="particles-js"></div>
  <header>
    <h1>ML Classification Summary</h1>
  </header>

  <main class="main-grid">
    <!-- Left Panel: Summary & Controls -->
    <aside class="left-panel">
      <section class="card">
        <h2>Video Summary</h2>
        <div id="summary"></div>
      </section>

      <section class="card">
        <h2>Focus Area</h2>
        <div id="topicSelector"></div>
      </section>

      <section class="card">
        <h2>Chart Controls</h2>
        <div class="selector-group" id="chartControlContainer"></div>
      </section>
    </aside>

    <!-- Right Panel: Output Charts -->
    <section class="right-panel">
      <div id="charts"></div>
      <div class="compare-row" id="compareCharts"></div>
    </section>
  </main>

  <!-- Bottom: Media Sections by Topic -->
  <section id="media-section">

    <div id="classification-media" class="media-gallery">
      <img src="assets/img2.png" alt="Class Label Visualization" class="media-img" />
      <img src="assets/label_heatmap.png" alt="Label Heatmap" class="media-img" />
      <video controls class="media-video">
        <source src="assets/output_fast.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>

    <div id="specialization-media" class="media-gallery" style="display:none">
      <img src="assets/img9.png" alt="Color Detection Sample" class="media-img" />
      <img src="assets/img11.png" alt="Direction Detection Sample" class="media-img" />
      <video controls class="media-video">
        <source src="assets/output_cropped.mp4" type="video/mp4">
        Your browser does not support the video tag.
      </video>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
